[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minicpm-local-tools"
version = "0.1.0"
description = "Local-first browser reading reports for macOS with MiniCPM"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1"]

[project.optional-dependencies]
pdf = ["pypdfium2>=4.30", "Pillow>=10"]
audio = ["mlx-whisper>=0.4.3; platform_machine == 'arm64' and sys_platform == 'darwin'"]
dev = ["numpy>=1.26", "pytest>=8", "ruff>=0.11"]

[project.scripts]
mcpm = "minicpm_tools.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/minicpm_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
